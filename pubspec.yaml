name: mercate
description: Mercate — offline-first small business POS and inventory assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  archive: ^3.6.1
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.3
  printing: ^5.14.2
  local_auth: ^2.3.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  excel: ^4.0.6
  innotrepid_security:
    git:
      url: https://github.com/innotrepid/Innotrepid-Security.git
      ref: 46ed46fe7e25c5b7dca10231a4cc1ab256027067
      path: packages/innotrepid_security

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4

platforms:
  android:
  ios:

flutter:
  uses-material-design: true
  assets:
    - assets/images/
