name: CI

on:
  push:
    branches: [main, foundation]
  pull_request:
    branches: [main, foundation]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt
          tail -60 analyze.txt

      - name: Test
        run: flutter test

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-analyze-log
          path: analyze.txt
          if-no-files-found: ignore
          retention-days: 7
