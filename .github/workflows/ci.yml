name: Flutter CI

on:
  push:
    branches: [main, foundation]
  pull_request:
    branches: [main, foundation]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        id: format
        continue-on-error: true
        run: dart format --set-exit-if-changed .

      - name: Show files needing format
        if: steps.format.outcome == 'failure'
        run: |
          echo "=== Applying dart format to show expected style ==="
          dart format .
          echo "=== Diff ==="
          git diff --stat
          git diff

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Fail if format was wrong
        if: steps.format.outcome == 'failure'
        run: |
          echo "Code is not dart-formatted. See 'Show files needing format' step."
          exit 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
