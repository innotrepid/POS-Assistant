name: Flutter CI

on:
  push:
    branches: [main, foundation]
  pull_request:
    branches: [main, foundation]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Apply dart format
        run: dart format .

      - name: Create format patch
        run: |
          git diff > format.patch || true
          if [ -s format.patch ]; then
            echo "Format changes detected"
            cat format.patch
          else
            echo "Already formatted"
            echo "# no changes" > format.patch
          fi

      - name: Upload format patch
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
          retention-days: 3

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
