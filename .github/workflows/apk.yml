name: Build Mercate APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate Android platform
        run: flutter create . --project-name mercate --org com.aetherion --platforms=android

      - name: Configure package id, label, desugaring
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/applicationId *= *".*"/applicationId = "com.aetherion.mercate"/' "$f" || true
            sed -i "s/applicationId \".*\"/applicationId \"com.aetherion.mercate\"/" "$f" || true
            sed -i 's/namespace *= *".*"/namespace = "com.aetherion.mercate"/' "$f" || true
            sed -i "s/namespace \".*\"/namespace \"com.aetherion.mercate\"/" "$f" || true
          done

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' android/app/src/main/AndroidManifest.xml
            grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
            grep -q USE_BIOMETRIC android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          fi

          if [ -f android/app/build.gradle.kts ]; then
            if ! grep -q isCoreLibraryDesugaringEnabled android/app/build.gradle.kts; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            fi
            if ! grep -q desugar_jdk_libs android/app/build.gradle.kts; then
              if grep -q 'dependencies {' android/app/build.gradle.kts; then
                sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' android/app/build.gradle.kts
              else
                printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
              fi
            fi
          elif [ -f android/app/build.gradle ]; then
            if ! grep -q coreLibraryDesugaringEnabled android/app/build.gradle; then
              sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            fi
            if ! grep -q desugar_jdk_libs android/app/build.gradle; then
              if grep -q 'dependencies {' android/app/build.gradle; then
                sed -i "/dependencies {/a\    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'" android/app/build.gradle
              else
                printf "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n" >> android/app/build.gradle
              fi
            fi
          fi

      - name: Install Mercate launcher icons
        run: |
          set -e
          pip install pillow -q
          LOGO="assets/images/Mercate Logo.png"
          if [ ! -f "$LOGO" ]; then
            echo "ERROR: Mercate logo not found at $LOGO"
            ls -la assets/images/ || true
            exit 1
          fi
          # Write icon script to a file (keeps workflow YAML valid)
          cat > /tmp/make_icons.py << 'EOF'
          from pathlib import Path
          from PIL import Image

          logo_path = Path("assets/images/Mercate Logo.png")
          img = Image.open(logo_path).convert("RGBA")

          # Fit logo on square transparent canvas with small padding
          def make_icon(size: int) -> Image.Image:
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              pad = max(1, size // 10)
              target = size - pad * 2
              copy = img.copy()
              copy.thumbnail((target, target), Image.Resampling.LANCZOS)
              x = (size - copy.width) // 2
              y = (size - copy.height) // 2
              canvas.paste(copy, (x, y), copy)
              return canvas

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          res = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              out_dir = res / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = make_icon(size)
              icon.save(out_dir / "ic_launcher.png")
              icon.save(out_dir / "ic_launcher_round.png")
              # Adaptive icon layers (API 26+)
              icon.save(out_dir / "ic_launcher_foreground.png")

          # Point adaptive icon XML at our foreground if present
          anydpi = res / "mipmap-anydpi-v26"
          if anydpi.is_dir():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  xml = anydpi / name
                  if xml.exists():
                      text = xml.read_text()
                      text = text.replace("@drawable/ic_launcher_foreground", "@mipmap/ic_launcher_foreground")
                      text = text.replace("@mipmap/ic_launcher_foreground", "@mipmap/ic_launcher_foreground")
                      xml.write_text(text)

          print("Mercate launcher icons installed")
          EOF
          # Remove leading indent from heredoc body for Python
          sed -i 's/^          //' /tmp/make_icons.py
          python3 /tmp/make_icons.py
          echo "Icons:"
          find android/app/src/main/res -name 'ic_launcher*.png' | head -20

      - run: flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mercate-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
