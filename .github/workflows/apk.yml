name: Build Mercate APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate Android platform
        run: flutter create . --project-name mercate --org com.aetherion --platforms=android

      - name: Configure package id, label, desugaring
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/applicationId *= *".*"/applicationId = "com.aetherion.mercate"/' "$f" || true
            sed -i "s/applicationId \".*\"/applicationId \"com.aetherion.mercate\"/" "$f" || true
            sed -i 's/namespace *= *".*"/namespace = "com.aetherion.mercate"/' "$f" || true
            sed -i "s/namespace \".*\"/namespace \"com.aetherion.mercate\"/" "$f" || true
          done

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' android/app/src/main/AndroidManifest.xml
            grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
            grep -q USE_BIOMETRIC android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          fi

          # flutter_local_notifications requires core library desugaring
          if [ -f android/app/build.gradle.kts ]; then
            python3 << 'PY'
from pathlib import Path
p = Path("android/app/build.gradle.kts")
t = p.read_text()
if "isCoreLibraryDesugaringEnabled" not in t:
    t = t.replace(
        "compileOptions {",
        "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
        1,
    )
if "desugar_jdk_libs" not in t:
    if "dependencies {" in t:
        t = t.replace(
            "dependencies {",
            'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
            1,
        )
    else:
        t += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
p.write_text(t)
print("desugaring enabled (kts)")
PY
          elif [ -f android/app/build.gradle ]; then
            python3 << 'PY'
from pathlib import Path
p = Path("android/app/build.gradle")
t = p.read_text()
if "coreLibraryDesugaringEnabled" not in t:
    t = t.replace(
        "compileOptions {",
        "compileOptions {\n        coreLibraryDesugaringEnabled true",
        1,
    )
if "desugar_jdk_libs" not in t:
    if "dependencies {" in t:
        t = t.replace(
            "dependencies {",
            "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
            1,
        )
    else:
        t += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
p.write_text(t)
print("desugaring enabled (gradle)")
PY
          fi

      - run: flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mercate-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
