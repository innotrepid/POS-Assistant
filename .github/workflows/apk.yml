name: Build Mercate APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - foundation
    paths:
      - lib/**
      - pubspec.yaml
      - assets/**
      - scripts/**
      - .github/workflows/apk.yml

concurrency:
  group: mercate-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate Android platform
        run: flutter create . --project-name mercate --org com.aetherion --platforms=android

      - name: Configure package id, label, minSdk
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/applicationId *= *"[^"]*"/applicationId = "com.aetherion.mercate"/' "$f" || true
              sed -i 's/applicationId "[^"]*"/applicationId "com.aetherion.mercate"/' "$f" || true
              sed -i 's/namespace *= *"[^"]*"/namespace = "com.aetherion.mercate"/' "$f" || true
              sed -i 's/minSdk *= *.*/minSdk = 24/' "$f" || true
              sed -i 's/minSdkVersion *.*/minSdkVersion 24/' "$f" || true
            fi
          done
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' "$MANIFEST"
            grep -q "USE_BIOMETRIC" "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' "$MANIFEST"
            grep -q "POST_NOTIFICATIONS" "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' "$MANIFEST"
          fi

      - name: Install Mercate launcher icons
        run: |
          python3 -m pip install pillow --break-system-packages --quiet || true
          python3 scripts/gen_launcher_icons.py

      - name: Enable core library desugaring
        run: python3 scripts/patch_desugar.py

      - name: Package visibility for dialer/SMS
        run: python3 scripts/patch_manifest_queries.py

      - name: Show gradle after patches
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && echo "=== $f ===" && head -80 "$f" || true
          done

      - name: Run flutter pub get
        run: flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -eo pipefail
          echo "Building Mercate ($BUILD_TYPE)"
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug 2>&1 | tee build.log
          else
            flutter build apk --release 2>&1 | tee build.log
          fi
          echo "APKs produced:"
          find build/app/outputs/flutter-apk -name '*.apk' -type f 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mercate-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
