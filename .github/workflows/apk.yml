name: Build Mercate APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate Android platform
        run: flutter create . --project-name mercate --org com.aetherion --platforms=android

      - name: Configure package id, label, minSdk
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/applicationId *= *".*"/applicationId = "com.aetherion.mercate"/' "$f" || true
            sed -i "s/applicationId \".*\"/applicationId \"com.aetherion.mercate\"/" "$f" || true
            sed -i 's/namespace *= *".*"/namespace = "com.aetherion.mercate"/' "$f" || true
            sed -i "s/namespace \".*\"/namespace \"com.aetherion.mercate\"/" "$f" || true
            sed -i 's/minSdk *= *.*/minSdk = 24/' "$f" || true
            sed -i 's/minSdkVersion *.*/minSdkVersion 24/' "$f" || true
          done

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' android/app/src/main/AndroidManifest.xml
            grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
            grep -q USE_BIOMETRIC android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Mercate launcher icons
        run: python3 scripts/gen_launcher_icons.py

      - name: Enable core library desugaring
        run: python3 scripts/patch_desugar.py

      - name: Show gradle after patches
        run: |
          echo "==== android/app/build.gradle.kts (head) ===="
          head -120 android/app/build.gradle.kts 2>/dev/null || true
          echo "==== android/app/build.gradle (head) ===="
          head -120 android/app/build.gradle 2>/dev/null || true

      - run: flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          set -eo pipefail
          echo "Building Mercate ($BUILD_TYPE)"
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug 2>&1 | tee build.log
          else
            flutter build apk --release 2>&1 | tee build.log
          fi
          echo "==== APK search ===="
          find build -name '*.apk' -type f 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mercate-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
