name: Manual APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  apk:
    name: Build Mercate APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform
        run: flutter create . --project-name mercate --org com.aetherion --platforms=android

      - name: Configure Mercate applicationId and label
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/applicationId *= *"[^"]*"/applicationId = "com.aetherion.mercate"/' "$f" || true
              sed -i 's/minSdk *= *.*/minSdk = 24/' "$f" || true
            fi
          done
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' "$MANIFEST"
          fi

      - name: Install Pillow
        run: python3 -m pip install pillow --break-system-packages --quiet

      - name: Generate launcher icons
        run: python3 scripts/gen_launcher_icons.py

      - name: Normalize desugar (disable half-config)
        run: python3 scripts/patch_desugar.py

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mercate-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
