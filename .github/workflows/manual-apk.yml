name: Manual APK Build

# Open Actions → "Manual APK Build" → blue "Run workflow" button (top right)
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  apk:
    name: Build Mercate APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name mercate --org com.aetherion --platforms=android
          else
            echo "android/ already present"
          fi

      - name: Configure Mercate id, label, icons
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/applicationId *= *"[^"]*"/applicationId = "com.aetherion.mercate"/' "$f" || true
              sed -i 's/applicationId "[^"]*"/applicationId "com.aetherion.mercate"/' "$f" || true
              sed -i 's/namespace *= *"[^"]*"/namespace = "com.aetherion.mercate"/' "$f" || true
              sed -i 's/namespace "[^"]*"/namespace "com.aetherion.mercate"/' "$f" || true
            fi
          done
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' "$MANIFEST"
            grep -q "USE_BIOMETRIC" "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' "$MANIFEST"
            grep -q "USE_FINGERPRINT" "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' "$MANIFEST"
          fi
          mkdir -p assets/images
          if [ -f "assets/images/Mercate Logo.png" ] && [ ! -s "assets/images/mercate_logo.png" ]; then
            cp "assets/images/Mercate Logo.png" assets/images/mercate_logo.png || true
          fi
          if [ -f assets/images/mercate_logo.png ] && [ -s assets/images/mercate_logo.png ]; then
            pip install pillow -q
            python3 -c "
from pathlib import Path
from PIL import Image
img = Image.open('assets/images/mercate_logo.png').convert('RGBA')
for folder, size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
    d = Path('android/app/src/main/res')/folder
    d.mkdir(parents=True, exist_ok=True)
    r = img.resize((size, size), Image.Resampling.LANCZOS)
    r.save(d/'ic_launcher.png')
    r.save(d/'ic_launcher_round.png')
print('icons ok')
"
          fi

      - run: flutter pub get

      - name: Analyze (report only)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt | tail -80

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          if [ "${BUILD_TYPE}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mercate-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
