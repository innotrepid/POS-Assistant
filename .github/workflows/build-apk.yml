name: Build APK

on:
  # Manual button in Actions tab
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  # Optional: still auto-build on foundation code changes
  push:
    branches: [foundation]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build ${{ github.event.inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create . --project-name pos_assistant --org com.innotrepid --platforms=android

      - name: Patch AndroidManifest (biometrics + notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' "$MANIFEST"
          fi
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' "$MANIFEST"
          fi

      - name: Enable core library desugaring
        run: |
          set -e
          GRADLE="android/app/build.gradle"
          if [ ! -f "$GRADLE" ]; then
            GRADLE="android/app/build.gradle.kts"
          fi
          echo "Patching $GRADLE for desugaring..."

          python3 << 'PY'
from pathlib import Path

candidates = [
    Path("android/app/build.gradle.kts"),
    Path("android/app/build.gradle"),
]
path = next((p for p in candidates if p.exists()), None)
if path is None:
    raise SystemExit("No android/app/build.gradle(.kts) found")

text = path.read_text()
is_kts = path.suffix == ".kts"
print(f"Using {path} (kts={is_kts})")

if is_kts:
    if "isCoreLibraryDesugaringEnabled" not in text:
        if "compileOptions {" in text:
            text = text.replace(
                "compileOptions {",
                "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                1,
            )
        else:
            text = text.replace(
                "android {",
                "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }",
                1,
            )
    if "desugar_jdk_libs" not in text:
        if "dependencies {" in text:
            text = text.replace(
                "dependencies {",
                'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                1,
            )
        else:
            text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
else:
    if "coreLibraryDesugaringEnabled" not in text:
        if "compileOptions {" in text:
            text = text.replace(
                "compileOptions {",
                "compileOptions {\n        coreLibraryDesugaringEnabled true",
                1,
            )
        else:
            text = text.replace(
                "android {",
                "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }",
                1,
            )
    if "desugar_jdk_libs" not in text:
        if "dependencies {" in text:
            text = text.replace(
                "dependencies {",
                "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                1,
            )
        else:
            text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"

path.write_text(text)
print("--- patched file ---")
print(path.read_text())
PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        id: build
        run: |
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building $TYPE APK..."
          if [ "$TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pos-assistant-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # Always upload diagnostics so failed builds are downloadable
      - name: Upload build diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-diagnostics
          path: |
            android/app/build.gradle
            android/app/build.gradle.kts
            android/app/src/main/AndroidManifest.xml
            android/gradle.properties
            android/settings.gradle
            android/settings.gradle.kts
            build/app/outputs/**
          if-no-files-found: ignore
          retention-days: 7
