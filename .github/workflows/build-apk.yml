name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [foundation]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --project-name pos_assistant --org com.innotrepid --platforms=android

      - name: Patch AndroidManifest (biometrics + notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' "$MANIFEST"
          fi
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' "$MANIFEST"
          fi

      - name: Enable core library desugaring
        run: |
          GRADLE="android/app/build.gradle"
          if [ ! -f "$GRADLE" ]; then
            GRADLE="android/app/build.gradle.kts"
          fi
          echo "Patching $GRADLE for desugaring..."

          if [[ "$GRADLE" == *.kts ]]; then
            # Kotlin DSL (Flutter 3.16+)
            if ! grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE"; then
              # Insert inside android { compileOptions { } }
              python3 << 'PY'
from pathlib import Path
p = Path("android/app/build.gradle.kts")
text = p.read_text()
if "isCoreLibraryDesugaringEnabled" in text:
    print("already enabled")
else:
    # Ensure compileOptions block enables desugaring
    if "compileOptions" in text:
        text = text.replace(
            "compileOptions {",
            "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
            1,
        )
    else:
        text = text.replace(
            "android {",
            "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }",
            1,
        )
    if "coreLibraryDesugaring(" not in text:
        # Add dependency
        if "dependencies {" in text:
            text = text.replace(
                "dependencies {",
                'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                1,
            )
        else:
            text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
    p.write_text(text)
    print("patched kts")
PY
            fi
          else
            # Groovy DSL
            if ! grep -q "coreLibraryDesugaringEnabled" "$GRADLE"; then
              python3 << 'PY'
from pathlib import Path
p = Path("android/app/build.gradle")
text = p.read_text()
if "coreLibraryDesugaringEnabled" not in text:
    if "compileOptions" in text:
        text = text.replace(
            "compileOptions {",
            "compileOptions {\n        coreLibraryDesugaringEnabled true",
            1,
        )
    else:
        text = text.replace(
            "android {",
            "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }",
            1,
        )
if "coreLibraryDesugaring" not in text or "desugar_jdk_libs" not in text:
    if "dependencies {" in text:
        text = text.replace(
            "dependencies {",
            "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
            1,
        )
    else:
        text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
p.write_text(text)
print("patched groovy")
PY
            fi
          fi
          echo "--- $GRADLE ---"
          cat "$GRADLE"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
