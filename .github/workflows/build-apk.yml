name: Build APK

on:
  # Manual run: Actions → Build APK → Run workflow
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - foundation
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Mercate APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform (Mercate)
        run: |
          flutter create . --project-name mercate --org com.aetherion --platforms=android

      - name: Configure applicationId, label, permissions, icons
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/applicationId *= *"[^"]*"/applicationId = "com.aetherion.mercate"/' "$f" || true
              sed -i 's/applicationId "[^"]*"/applicationId "com.aetherion.mercate"/' "$f" || true
              sed -i 's/namespace *= *"[^"]*"/namespace = "com.aetherion.mercate"/' "$f" || true
              sed -i 's/namespace "[^"]*"/namespace "com.aetherion.mercate"/' "$f" || true
            fi
          done
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' "$MANIFEST"
            grep -q "USE_BIOMETRIC" "$MANIFEST" || \
              sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' "$MANIFEST"
            grep -q "USE_FINGERPRINT" "$MANIFEST" || \
              sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' "$MANIFEST"
            grep -q "POST_NOTIFICATIONS" "$MANIFEST" || \
              sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' "$MANIFEST"
          fi
          mkdir -p assets/images
          LOGO=""
          if [ -f "assets/images/mercate_logo.png" ] && [ -s "assets/images/mercate_logo.png" ]; then
            LOGO="assets/images/mercate_logo.png"
          elif [ -f "assets/images/Mercate Logo.png" ] && [ -s "assets/images/Mercate Logo.png" ]; then
            cp "assets/images/Mercate Logo.png" assets/images/mercate_logo.png
            LOGO="assets/images/mercate_logo.png"
          elif [ -f "assets/images/mercate_logo.b64" ]; then
            base64 -d assets/images/mercate_logo.b64 > assets/images/mercate_logo.png || true
            LOGO="assets/images/mercate_logo.png"
          fi
          if [ -n "$LOGO" ] && [ -f "$LOGO" ] && [ -s "$LOGO" ]; then
            echo "Generating launcher icons from $LOGO"
            pip install pillow -q
            python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          logo = Path("assets/images/mercate_logo.png")
          img = Image.open(logo).convert("RGBA")
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, size in sizes.items():
              out_dir = Path("android/app/src/main/res") / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(out_dir / "ic_launcher.png")
              resized.save(out_dir / "ic_launcher_round.png")
          print("Launcher icons written")
          PY
          else
            echo "No Mercate logo found — using default Flutter icon"
          fi
          ls -la assets/images/ || true

      - name: Enable core library desugaring
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          if not path.exists():
              path = Path("android/app/build.gradle")
          if not path.exists():
              raise SystemExit(0)
          text = path.read_text()
          is_kts = path.name.endswith(".kts")
          if is_kts:
              if "isCoreLibraryDesugaringEnabled" not in text and "compileOptions {" in text:
                  text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "desugar_jdk_libs" not in text and "dependencies {" in text:
                  text = text.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n', 1)
          else:
              if "coreLibraryDesugaringEnabled" not in text and "compileOptions {" in text:
                  text = text.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "desugar_jdk_libs" not in text and "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n", 1)
          path.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build Mercate APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          echo "Building Mercate (${BUILD_TYPE}) — com.aetherion.mercate"
          if [ "${BUILD_TYPE}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Mercate APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mercate-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
