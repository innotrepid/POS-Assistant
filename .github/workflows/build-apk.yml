name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches: [foundation]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform (Mercate / com.aetherion.mercate)
        run: |
          flutter create . --project-name mercate --org com.aetherion --platforms=android

      - name: Set applicationId, label, logo, launcher icons
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/applicationId *= *".*"/applicationId = "com.aetherion.mercate"/' "$f" || true
              sed -i "s/applicationId \".*\"/applicationId \"com.aetherion.mercate\"/" "$f" || true
              sed -i 's/namespace *= *".*"/namespace = "com.aetherion.mercate"/' "$f" || true
              sed -i "s/namespace \".*\"/namespace \"com.aetherion.mercate\"/" "$f" || true
            fi
          done
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mercate"/' "$MANIFEST"
            grep -q "USE_BIOMETRIC" "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' "$MANIFEST"
            grep -q "USE_FINGERPRINT" "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' "$MANIFEST"
          fi
          mkdir -p assets/images
          if [ -f assets/images/mercate_logo.b64 ]; then
            base64 -d assets/images/mercate_logo.b64 > assets/images/mercate_logo.png || true
          fi
          LOGO="assets/images/mercate_logo.png"
          if [ -f "$LOGO" ] && [ -s "$LOGO" ]; then
            echo "Generating launcher icons from $LOGO"
            pip install pillow -q
            python3 << 'PY'
from pathlib import Path
from PIL import Image
logo = Path("assets/images/mercate_logo.png")
img = Image.open(logo).convert("RGBA")
sizes = {
    "mipmap-mdpi": 48,
    "mipmap-hdpi": 72,
    "mipmap-xhdpi": 96,
    "mipmap-xxhdpi": 144,
    "mipmap-xxxhdpi": 192,
}
for folder, size in sizes.items():
    out_dir = Path("android/app/src/main/res") / folder
    out_dir.mkdir(parents=True, exist_ok=True)
    resized = img.resize((size, size), Image.Resampling.LANCZOS)
    resized.save(out_dir / "ic_launcher.png")
    resized.save(out_dir / "ic_launcher_round.png")
print("Launcher icons written")
PY
          else
            echo "No logo found for launcher icons"
          fi
          ls -la assets/images/ || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          echo "Building ${BUILD_TYPE} APK for com.aetherion.mercate (Mercate)..."
          if [ "${BUILD_TYPE}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mercate-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
